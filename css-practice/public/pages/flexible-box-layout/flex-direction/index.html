<!doctype html>
<html lang="ko">
<head>
  <title>flex-direction</title>
  <meta charset="utf-8" />
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="stylesheet" href="page.css" />
  <script src="/lib/prism/prism.js"></script>
  <script type="module" src="/scripts/fire-when-ready.js"></script>
</head>
<body>
<header>
  <nav></nav>
</header>

<main>
  <article>
    <h1>flex-direction</h1>

    <section>
      <div id="toc"></div>
    </section>

    <section>
      <h2>개요</h2>
      <p>flex-direction은 Flexbox에서 플렉스 아이템들이 배치되는 주축의 방향을 결정한다.</p>
      <p>생략하면 좌->우 혹은 위->아래로 배치된다.</p>

    </section>

    <section>
      <h2>Values</h2>
      <p>flex-direction의 기본값은 <code class="language-css">row</code>다.</p>

      <h3>row</h3>
      <div class="code-result">
        <div class="container row">
          <div class="item">1</div>
          <div class="item">2</div>
          <div class="item">3</div>
        </div>
      </div>

      <h3>row-reverse</h3>
      <div class="code-result">
        <div class="container row-reverse">
          <div class="item">1</div>
          <div class="item">2</div>
          <div class="item">3</div>
        </div>
      </div>

      <h3>column</h3>
      <div class="code-result">
        <div class="container column">
          <div class="item">1</div>
          <div class="item">2</div>
          <div class="item">3</div>
        </div>
      </div>

      <h3>column-reverse</h3>
      <div class="code-result">
        <div class="container column-reverse">
          <div class="item">1</div>
          <div class="item">2</div>
          <div class="item">3</div>
        </div>
      </div>

    </section>
  </article>
</main>

<footer>
  <a class="back-button" href="/pages">⬅ pages로 돌아가기</a>
</footer>
</body>
</html>
